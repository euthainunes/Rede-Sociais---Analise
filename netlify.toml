# Netlify: o site Next.js fica em apps/web (monorepo pnpm). O adaptador oficial do Next.js
# (OpenNext) é instalado automaticamente; não é preciso plugin manual.
[build]
  base = "apps/web"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
