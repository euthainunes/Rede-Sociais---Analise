<!doctype html>
<html lang="pt-BR">
<head>

<title>BR-WAR — Operação Liberta o Mito</title>
<style>

<div id="tela"><canvas id="game" tabindex="0" aria-label="BR-WAR: jogo de plataforma satírico"></canvas><canvas id="ui" aria-hidden="true"></canvas></div>

<script type="module" src="src/missao.js"></script>

</html>
